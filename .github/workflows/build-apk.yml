name: Flutter Testleri

on:
  push:
  workflow_dispatch:
    inputs:
      build_preview_apk:
        description: "Testleri tamamladıktan sonra önizleme APK'sı üret"
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      - run: flutter analyze --no-fatal-infos

  preview-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.build_preview_apk
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: reflex2-preview-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
