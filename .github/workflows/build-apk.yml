name: Flutter Testleri

on:
  push:
  workflow_dispatch:
    inputs:
      build_preview_apk:
        description: "Testleri tamamladıktan sonra önizleme APK'sı üret"
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      - run: flutter analyze --no-fatal-infos

  preview-apk:
    if: needs.test.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.build_preview_apk) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-preview-apk]')))
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Play paketine ve yükleme imzasına göre hazırla
        env:
          P: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$P"
          openssl enc -d -aes-256-cbc -pbkdf2 -in tools/upload-keystore.enc -out android/upload-keystore.jks -pass env:P
          {
            echo "storePassword=$P"
            echo "keyPassword=$P"
            echo "keyAlias=upload"
            echo "storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks"
          } > android/key.properties
          source release.config
          bash tools/prepare_android_release.sh "$APP_NAME" "$APP_ID"
          trap 'rm -f android/upload-keystore.jks android/key.properties' EXIT

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: reflex2-preview-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  upload-key-fingerprints:
    if: github.ref == 'refs/heads/redesign/modern-competitive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yükleme anahtarı sertifika parmak izlerini güvenli biçimde çıkar
        env:
          P: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -f tools/upload-keystore.enc
          test -n "$P"
          mkdir -p android
          trap 'rm -f android/upload-keystore.jks' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -in tools/upload-keystore.enc -out android/upload-keystore.jks -pass env:P
          keytool -list -v -keystore android/upload-keystore.jks -storepass "$P" -alias upload
